# Save as .github/workflows/nightly.yml. Zero-server option; turn on GitHub Pages (Settings > Pages > main /docs).
# BSE may block GitHub's overseas IPs: the --probe step prints exactly what BSE returns, so check the first run's log.
name: nightly-bse
on:
  schedule: [{cron: "0 14 * * *"}, {cron: "0 17 * * *"}]   # 19:30 and 22:30 IST
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas
      - run: python bse_fetch.py --probe || true
      - run: ./nightly.sh
      - run: |
          git config user.name "bse-bot"; git config user.email "bse-bot@users.noreply.github.com"
          git add bse_data docs/data.json
          git diff --cached --quiet || (git commit -m "data $(date -u +%F)" && git push)
