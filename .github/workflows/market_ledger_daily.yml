name: Daily Market Ledger Ingestion & Deployment

on:
  schedule:
    # 19:30 IST (14:00 UTC) Monday-Friday - Post-market daily BhavCopy release
    - cron: '0 14 * * 1-5'
    # 22:30 IST (17:00 UTC) Monday-Friday - Nightly reconciliation & catch-up run
    - cron: '0 17 * * 1-5'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "market-ledger-live"
  cancel-in-progress: true

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Master Ingestion & Calculation Pipeline
        run: |
          python run_pipeline.py --fetch

      - name: Execute Automated Unit Tests
        run: |
          python -m unittest tests/test_revenue_engine.py

      - name: Commit and Push Updated Market Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ reference/ bse_data/ nse_data/
          git diff --cached --quiet || (git commit -m "Auto-update market ledger data: $(date -u +%F) [skip ci]" && git push)
